name: Build Khaled Star Hero (Godot 4.4.1)
on:
  workflow_dispatch:
  push:
    branches: [khaled-star-hero-android]
    paths:
      - 'khaled-game/**'
      - '.github/workflows/khaled-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original Godot project
        run: |
          test -f khaled-game/project.godot
          test -f khaled-game/export_presets.cfg
      - name: Build Android APK with Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Import project assets
        working-directory: khaled-game
        run: godot --headless --editor --import --quit
      - name: Export Android
        working-directory: khaled-game
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/KhaledStarHero.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khaled-Star-Hero-APK
          path: khaled-game/build/KhaledStarHero.apk
          if-no-files-found: error
